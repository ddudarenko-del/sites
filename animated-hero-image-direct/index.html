  <title>Direct Image Animation Demo</title>
  <style>
    :root {
      --bg: #05030a;
      --text: rgba(245, 239, 255, 0.92);
      --muted: rgba(245, 239, 255, 0.62);
      --panel: rgba(8, 6, 14, 0.34);
      --line: rgba(255,255,255,0.08);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }

    .hero {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 50%, #120d1d 0%, #09060f 44%, #030208 100%);
      isolation: isolate;
    }

    .layer,
    .shade,
    .vignette,
    .glow,
    .hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .layer--base {
      filter: saturate(1.03) contrast(1.03) brightness(0.98);
      opacity: 0.98;
      transform: scale(1.03);
    }

    .layer--left {
      opacity: 0.52;
      filter: url(#warpLeft) saturate(1.14) brightness(1.02);
      mix-blend-mode: screen;
      -webkit-mask-image: linear-gradient(90deg, rgba(0,0,0,1) 0%, rgba(0,0,0,0.98) 32%, rgba(0,0,0,0.55) 48%, rgba(0,0,0,0.0) 64%);
      mask-image: linear-gradient(90deg, rgba(0,0,0,1) 0%, rgba(0,0,0,0.98) 32%, rgba(0,0,0,0.55) 48%, rgba(0,0,0,0.0) 64%);
      transform: scale(1.045);
    }

    .layer--right {
      opacity: 0.44;
      filter: url(#warpRight) saturate(1.12) contrast(1.06) brightness(1.0);
      mix-blend-mode: screen;
      -webkit-mask-image:
        radial-gradient(120% 88% at 78% 35%, rgba(0,0,0,1) 0%, rgba(0,0,0,0.95) 18%, rgba(0,0,0,0.78) 28%, rgba(0,0,0,0.20) 52%, rgba(0,0,0,0.0) 70%),
        linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.0) 45%, rgba(0,0,0,0.94) 58%, rgba(0,0,0,1) 100%);
      mask-image:
        radial-gradient(120% 88% at 78% 35%, rgba(0,0,0,1) 0%, rgba(0,0,0,0.95) 18%, rgba(0,0,0,0.78) 28%, rgba(0,0,0,0.20) 52%, rgba(0,0,0,0.0) 70%),
        linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.0) 45%, rgba(0,0,0,0.94) 58%, rgba(0,0,0,1) 100%);
      transform: scale(1.04);
    }

    .layer--core {
      opacity: 0.72;
      filter: blur(2px) saturate(1.10);
      mix-blend-mode: screen;
      -webkit-mask-image: radial-gradient(circle at 49% 55%, rgba(0,0,0,1) 0%, rgba(0,0,0,0.95) 3.5%, rgba(0,0,0,0.4) 9%, rgba(0,0,0,0.0) 17%);
      mask-image: radial-gradient(circle at 49% 55%, rgba(0,0,0,1) 0%, rgba(0,0,0,0.95) 3.5%, rgba(0,0,0,0.4) 9%, rgba(0,0,0,0.0) 17%);
      transform: scale(1.02);
    }

    .glow {
      background:
        radial-gradient(circle at 49% 55%, rgba(255,255,255,0.34) 0%, rgba(223, 193, 255, 0.16) 3%, rgba(170, 110, 255, 0.08) 7%, rgba(0,0,0,0) 14%),
        radial-gradient(80% 35% at 79% 27%, rgba(182, 125, 255, 0.12), transparent 42%),
        radial-gradient(55% 30% at 26% 55%, rgba(144, 94, 255, 0.06), transparent 58%);
      mix-blend-mode: screen;
      opacity: 0.7;
      filter: blur(10px);
    }

    .shade {
      background:
        linear-gradient(90deg, rgba(4,3,10,0.42) 0%, rgba(4,3,10,0.16) 28%, rgba(4,3,10,0.06) 100%),
        linear-gradient(180deg, rgba(4,3,10,0.06) 0%, rgba(4,3,10,0.0) 36%, rgba(4,3,10,0.26) 100%);
    }

    .vignette {
      background: radial-gradient(circle at 50% 50%, transparent 52%, rgba(0,0,0,0.08) 75%, rgba(0,0,0,0.33) 100%);
    }

    .hud {
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      padding: clamp(22px, 3vw, 36px);
      z-index: 2;
    }

    .hud__card {
      max-width: 460px;
      padding: 16px 18px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(9, 7, 16, 0.44), rgba(9, 7, 16, 0.24));
      backdrop-filter: blur(10px);
      box-shadow: inset 0 0 0 1px var(--line);
      pointer-events: auto;
    }

    .hud__tag {
      display: inline-flex;
      margin-bottom: 10px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.03em;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 0.96;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: clamp(14px, 1.8vw, 18px);
      line-height: 1.5;
    }

    @media (max-width: 820px) {
      .layer { background-position: 58% center; }
      .hud { align-items: flex-end; }
      .hud__card { max-width: 100%; }
      .shade {
        background:
          linear-gradient(180deg, rgba(4,3,10,0.10) 0%, rgba(4,3,10,0.05) 34%, rgba(4,3,10,0.52) 100%),
          linear-gradient(90deg, rgba(4,3,10,0.22), rgba(4,3,10,0.06));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .layer, .glow { animation: none !important; transform: none !important; }
    }
  </style>
</head>
<body>
  <section class="hero">
    <svg width="0" height="0" aria-hidden="true" style="position:absolute">
      <filter id="warpLeft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence id="noiseLeft" type="fractalNoise" baseFrequency="0.003 0.022" numOctaves="2" seed="4" result="noiseLeftMap">
          <animate attributeName="baseFrequency" dur="14s" repeatCount="indefinite" values="0.003 0.022; 0.0045 0.03; 0.003 0.022" />
        </feTurbulence>
        <feDisplacementMap id="displaceLeft" in="SourceGraphic" in2="noiseLeftMap" scale="6" xChannelSelector="R" yChannelSelector="B" />
      </filter>
      <filter id="warpRight" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence id="noiseRight" type="fractalNoise" baseFrequency="0.002 0.010" numOctaves="2" seed="9" result="noiseRightMap">
          <animate attributeName="baseFrequency" dur="18s" repeatCount="indefinite" values="0.002 0.010; 0.003 0.015; 0.002 0.010" />
        </feTurbulence>
        <feDisplacementMap id="displaceRight" in="SourceGraphic" in2="noiseRightMap" scale="4" xChannelSelector="G" yChannelSelector="B" />
      </filter>
    </svg>

    <div class="layer layer--base"></div>
    <div class="layer layer--left"></div>
    <div class="layer layer--right"></div>
    <div class="layer layer--core"></div>
    <div class="glow"></div>
    <div class="shade"></div>
    <div class="vignette"></div>

    <div class="hud">
      <div class="hud__card">
        <div class="hud__tag">direct image animation</div>
        <h1>Animate the source itself.</h1>
        <p>
          Здесь двигается не нарисованный поверх поток, а сама исходная картинка: очень мягкий warp,
          дыхание центральной вспышки и лёгкий drift по маскам — без ощущения, что фон "перерисовали".
        </p>
      </div>
    </div>
  </section>

  <script>
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reduceMotion) {
      const LOOP = 14000;
      const base = document.querySelector('.layer--base');
      const left = document.querySelector('.layer--left');
      const right = document.querySelector('.layer--right');
      const core = document.querySelector('.layer--core');
      const glow = document.querySelector('.glow');
      const displaceLeft = document.getElementById('displaceLeft');
      const displaceRight = document.getElementById('displaceRight');

      const ease = (x) => 0.5 - 0.5 * Math.cos(Math.PI * 2 * x);

      function tick(now) {
        const t = (now % LOOP) / LOOP;
        const a = 0.5 + 0.5 * Math.sin(t * Math.PI * 2);
        const b = 0.5 + 0.5 * Math.sin(t * Math.PI * 2 + Math.PI * 0.72);
        const c = 0.5 + 0.5 * Math.sin(t * Math.PI * 4 + Math.PI * 0.18);
        const smooth = ease(t);

        displaceLeft.setAttribute('scale', (4.2 + a * 3.4).toFixed(2));
        displaceRight.setAttribute('scale', (2.2 + b * 2.0).toFixed(2));

        base.style.transform = `scale(${(1.024 + a * 0.010).toFixed(4)}) translate3d(${((b - 0.5) * 1.2).toFixed(2)}px, ${((a - 0.5) * 0.8).toFixed(2)}px, 0)`;
        left.style.transform = `scale(${(1.038 + b * 0.012).toFixed(4)}) translate3d(${((-10 + smooth * 20) * 0.35).toFixed(2)}px, ${((a - 0.5) * 3.8).toFixed(2)}px, 0)`;
        left.style.opacity = (0.40 + a * 0.18).toFixed(3);

        right.style.transform = `scale(${(1.032 + a * 0.010).toFixed(4)}) translate3d(${((a - 0.5) * 3.2).toFixed(2)}px, ${((-5 + smooth * 10) * -0.25).toFixed(2)}px, 0)`;
        right.style.opacity = (0.30 + b * 0.18).toFixed(3);

        core.style.transform = `scale(${(1.00 + c * 0.06).toFixed(4)})`;
        core.style.opacity = (0.42 + a * 0.28).toFixed(3);

        glow.style.opacity = (0.42 + b * 0.22).toFixed(3);
        glow.style.transform = `scale(${(0.985 + a * 0.05).toFixed(4)})`;

        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    }
  </script>
