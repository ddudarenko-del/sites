<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero MP4 Loop</title>
  <style>
    :root { --bg:#05030a; --text:#f6f1ff; --muted:rgba(246,241,255,.64); --line:rgba(255,255,255,.08); }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .hero { position:relative; min-height:100svh; overflow:hidden; background:radial-gradient(circle at 50% 50%, #130d1f 0%, #08060e 48%, #030208 100%); }
    video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .shade { position:absolute; inset:0; background:linear-gradient(90deg, rgba(4,3,10,.58) 0%, rgba(4,3,10,.22) 28%, rgba(4,3,10,.10) 56%, rgba(4,3,10,.18) 100%), linear-gradient(180deg, rgba(4,3,10,.06) 0%, rgba(4,3,10,0) 34%, rgba(4,3,10,.36) 100%); }
    .content { position:relative; z-index:1; min-height:100svh; display:flex; align-items:flex-end; padding:clamp(24px,3vw,36px); }
    .card { max-width:430px; padding:16px 18px; border-radius:18px; background:linear-gradient(180deg, rgba(9,7,16,.42), rgba(9,7,16,.22)); backdrop-filter:blur(10px); box-shadow:inset 0 0 0 1px var(--line); }
    .tag { display:inline-flex; padding:7px 10px; border-radius:999px; background:rgba(255,255,255,.05); box-shadow:inset 0 0 0 1px rgba(255,255,255,.06); color:var(--muted); font-size:12px; margin-bottom:10px; }
    h1 { margin:0 0 10px; font-size:clamp(30px,5vw,48px); line-height:.96; letter-spacing:-.04em; }
    p { margin:0; color:var(--muted); font-size:clamp(14px,1.8vw,18px); line-height:1.5; }
  </style>
</head>
<body>
  <section class="hero">
    <video autoplay muted loop playsinline preload="auto" poster="./hero-poster.jpg">
      <source src="./hero-loop-v1.mp4" type="video/mp4" />
    </video>
    <div class="shade"></div>
    <div class="content">
      <div class="card">
        <div class="tag">mp4 loop v1</div>
        <h1>Subtle hero motion.</h1>
        <p>Сделал публичный MP4 loop на базе исходной картинки: без тяжёлой перерисовки, с мягким движением фрагментов, дуги и центральной вспышки.</p>
      </div>
    </div>
  </section>
</body>
</html>
