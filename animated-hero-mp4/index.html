<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero Motion Stable v2</title>
  <style>
    :root {
      --bg: #05030a;
      --text: #f6f1ff;
      --muted: rgba(246, 241, 255, 0.68);
      --line: rgba(255,255,255,0.08);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .hero {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #120d1d 0%, #08060e 48%, #030208 100%);
      isolation: isolate;
    }

    .media,
    .img,
    .glow,
    .sweep,
    .dust,
    .shade,
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .img {
      background-image: url('./hero-poster.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transform-origin: center center;
      will-change: transform, opacity;
    }

    .img--base {
      transform: scale(1.028);
      filter: saturate(1.03) contrast(1.03) brightness(0.98);
      opacity: 0.98;
    }

    .img--left {
      transform: scale(1.031);
      opacity: 0.22;
      mix-blend-mode: screen;
      filter: saturate(1.12) brightness(1.03);
      -webkit-mask-image: linear-gradient(90deg, rgba(0,0,0,1) 0%, rgba(0,0,0,0.98) 30%, rgba(0,0,0,0.58) 48%, rgba(0,0,0,0.0) 66%);
      mask-image: linear-gradient(90deg, rgba(0,0,0,1) 0%, rgba(0,0,0,0.98) 30%, rgba(0,0,0,0.58) 48%, rgba(0,0,0,0.0) 66%);
      animation: leftDrift 14s ease-in-out infinite;
    }

    .img--arc {
      transform: scale(1.034);
      opacity: 0.32;
      mix-blend-mode: screen;
      filter: saturate(1.14) contrast(1.04) brightness(1.02);
      -webkit-mask-image:
        radial-gradient(120% 90% at 79% 32%, rgba(0,0,0,1) 0%, rgba(0,0,0,0.96) 18%, rgba(0,0,0,0.82) 28%, rgba(0,0,0,0.26) 52%, rgba(0,0,0,0.0) 72%),
        linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.0) 48%, rgba(0,0,0,0.90) 60%, rgba(0,0,0,1) 100%);
      mask-image:
        radial-gradient(120% 90% at 79% 32%, rgba(0,0,0,1) 0%, rgba(0,0,0,0.96) 18%, rgba(0,0,0,0.82) 28%, rgba(0,0,0,0.26) 52%, rgba(0,0,0,0.0) 72%),
        linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.0) 48%, rgba(0,0,0,0.90) 60%, rgba(0,0,0,1) 100%);
      animation: arcBreathe 10s ease-in-out infinite;
    }

    .img--core {
      transform: scale(1.01);
      opacity: 0.44;
      mix-blend-mode: screen;
      filter: blur(1.2px) saturate(1.16);
      -webkit-mask-image: radial-gradient(circle at 49% 55%, rgba(0,0,0,1) 0%, rgba(0,0,0,0.96) 3.5%, rgba(0,0,0,0.42) 9%, rgba(0,0,0,0.0) 17%);
      mask-image: radial-gradient(circle at 49% 55%, rgba(0,0,0,1) 0%, rgba(0,0,0,0.96) 3.5%, rgba(0,0,0,0.42) 9%, rgba(0,0,0,0.0) 17%);
      animation: corePulse 8s ease-in-out infinite;
    }

    .glow {
      background:
        radial-gradient(circle at 49% 55%, rgba(255,255,255,0.28) 0%, rgba(228,198,255,0.14) 2.8%, rgba(168,109,255,0.08) 7%, rgba(0,0,0,0) 14%),
        radial-gradient(90% 26% at 78% 28%, rgba(185,125,255,0.11), transparent 42%),
        radial-gradient(65% 26% at 24% 56%, rgba(147,96,255,0.05), transparent 58%);
      mix-blend-mode: screen;
      opacity: 0.52;
      filter: blur(10px);
      animation: glowPulse 8s ease-in-out infinite;
    }

    .sweep {
      background: linear-gradient(111deg,
        transparent 38%,
        rgba(255,255,255,0.00) 44%,
        rgba(235,213,255,0.02) 48%,
        rgba(223,186,255,0.08) 50%,
        rgba(255,255,255,0.00) 54%,
        transparent 60%);
      mix-blend-mode: screen;
      opacity: 0.16;
      filter: blur(20px);
      transform: translateX(-8%) rotate(-8deg);
      animation: sweepMove 12s linear infinite;
    }

    .dust {
      background-image:
        radial-gradient(circle at 14% 28%, rgba(255,255,255,0.78) 0.8px, transparent 1px),
        radial-gradient(circle at 32% 62%, rgba(222,203,255,0.64) 0.8px, transparent 1px),
        radial-gradient(circle at 68% 22%, rgba(255,255,255,0.68) 0.8px, transparent 1px),
        radial-gradient(circle at 86% 60%, rgba(220,200,255,0.58) 0.8px, transparent 1px);
      background-size: 260px 260px, 360px 360px, 420px 420px, 520px 520px;
      mix-blend-mode: screen;
      opacity: 0.055;
      animation: dustPulse 9s ease-in-out infinite;
    }

    .shade {
      background:
        linear-gradient(90deg, rgba(4,3,10,.58) 0%, rgba(4,3,10,.22) 28%, rgba(4,3,10,.10) 56%, rgba(4,3,10,.18) 100%),
        linear-gradient(180deg, rgba(4,3,10,.06) 0%, rgba(4,3,10,0) 34%, rgba(4,3,10,.36) 100%);
      z-index: 1;
    }

    .vignette {
      background: radial-gradient(circle at 50% 50%, transparent 52%, rgba(0,0,0,0.08) 75%, rgba(0,0,0,0.34) 100%);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      min-height: 100svh;
      display: flex;
      align-items: flex-end;
      padding: clamp(24px, 3vw, 36px);
    }

    .card {
      max-width: 480px;
      padding: 16px 18px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(9,7,16,.42), rgba(9,7,16,.22));
      backdrop-filter: blur(10px);
      box-shadow: inset 0 0 0 1px var(--line);
    }

    .tag {
      display: inline-flex;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.05);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 5vw, 48px);
      line-height: .96;
      letter-spacing: -.04em;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: clamp(14px, 1.8vw, 18px);
      line-height: 1.5;
    }

    .meta {
      margin-top: 12px;
      font-size: 13px;
      color: rgba(246, 241, 255, 0.52);
    }

    @keyframes leftDrift {
      0%, 100% { transform: scale(1.031) translate3d(-1px, 0px, 0); opacity: 0.20; }
      50% { transform: scale(1.034) translate3d(1px, -1px, 0); opacity: 0.26; }
    }

    @keyframes arcBreathe {
      0%, 100% { transform: scale(1.034) translate3d(0px, 0px, 0); opacity: 0.30; }
      50% { transform: scale(1.038) translate3d(1px, -2px, 0); opacity: 0.36; }
    }

    @keyframes corePulse {
      0%, 100% { transform: scale(1.01); opacity: 0.38; }
      50% { transform: scale(1.055); opacity: 0.54; }
    }

    @keyframes glowPulse {
      0%, 100% { transform: scale(1); opacity: 0.48; }
      50% { transform: scale(1.03); opacity: 0.60; }
    }

    @keyframes sweepMove {
      0% { transform: translateX(-12%) rotate(-8deg); opacity: 0.10; }
      50% { transform: translateX(4%) rotate(-8deg); opacity: 0.18; }
      100% { transform: translateX(-12%) rotate(-8deg); opacity: 0.10; }
    }

    @keyframes dustPulse {
      0%, 100% { opacity: 0.045; }
      50% { opacity: 0.065; }
    }

    @media (max-width: 820px) {
      .img { background-position: 58% center; }
      .shade {
        background:
          linear-gradient(180deg, rgba(4,3,10,0.10) 0%, rgba(4,3,10,0.06) 34%, rgba(4,3,10,0.54) 100%),
          linear-gradient(90deg, rgba(4,3,10,0.22), rgba(4,3,10,0.06));
      }
      .card { max-width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .img--left,
      .img--arc,
      .img--core,
      .glow,
      .sweep,
      .dust {
        animation: none !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="media">
      <div class="img img--base"></div>
      <div class="img img--left"></div>
      <div class="img img--arc"></div>
      <div class="img img--core"></div>
      <div class="glow"></div>
      <div class="sweep"></div>
      <div class="dust"></div>
      <div class="shade"></div>
      <div class="vignette"></div>
    </div>

    <div class="content">
      <div class="card">
        <div class="tag">stable v2 · html underlay</div>
        <h1>Без тряски, только внутренняя жизнь.</h1>
        <p>
          Убрал глобальный wobble. База теперь стоит жёстко, а двигаются только локальные зоны:
          центр дышит, правая дуга чуть живёт, слева есть почти незаметный shimmer.
        </p>
        <div class="meta">Старый MP4 оставил рядом как reference: hero-loop-v1.mp4</div>
      </div>
    </div>
  </section>
</body>
</html>
